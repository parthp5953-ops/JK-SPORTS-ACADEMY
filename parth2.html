<!DOCTYPE html>
<html>
<head>
<title>JK Sports Academy</title>

<style>
body {
margin: 0;
font-family: Arial;
background: linear-gradient(to bottom, #2e7d32, #1b5e20);
color: white;
}

h1 {
text-align: center;
background: black;
padding: 20px;
}

.container {
width: 90%;
margin: auto;
}

section {
background: rgba(255,255,255,0.1);
padding: 20px;
margin: 20px 0;
border-radius: 10px;
}

table {
width: 100%;
background: white;
color: black;
border-collapse: collapse;
}

th, td {
padding: 10px;
border: 1px solid #ccc;
}

button {
margin: 5px;
}
</style>
</head>

<body>

<h1>JK Sports Academy</h1>

<div class="container">

<section>
<h2>Sports Kits</h2>
<table id="sportsTable">
<tr>
<th>Sport</th>
<th>Kit</th>
<th>Purpose</th>
</tr>
</table>
</section>

<section>
<h2>Enrollment</h2>
<form id="form">

<input type="text" id="name" placeholder="Name" required
pattern="[A-Za-z ]+" title="Only alphabets allowed"
oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"><br><br>

<input type="text" id="phone" placeholder="Phone" required maxlength="10"
pattern="[0-9]{10}" title="Enter 10 digit number"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"><br><br>

<select id="sport">
<option>Cricket</option>
<option>Football</option>
<option>Basketball</option>
</select><br><br>

<textarea id="message" placeholder="Message"></textarea><br><br>

<button type="submit">Enroll</button>
</form>
</section>

<section>
<h2>Enrolled Students</h2>
<table id="userTable"></table>
</section>

<section>
<h2>Buy Sports Kits</h2>
<div id="shop"></div>

<h3>Cart</h3>
<ul id="cartList"></ul>
<h3>Total: ₹<span id="total">0</span></h3>
</section>

</div>

<script>
const sportsData = [
{sport:"Cricket",kit:"Bat",purpose:"Hitting ball"},
{sport:"Football",kit:"Shoes",purpose:"Running"},
{sport:"Basketball",kit:"Jersey",purpose:"Identification"}
];

const sportsTable = document.getElementById("sportsTable");

sportsData.forEach(item => {
let row = document.createElement("tr");
row.innerHTML = `
<td>${item.sport}</td>
<td>${item.kit}</td>
<td>${item.purpose}</td>
`;
sportsTable.appendChild(row);
});
document.getElementById("form").addEventListener("submit", function(e){
e.preventDefault();

let nameValue = document.getElementById("name").value.trim();
let phoneValue = document.getElementById("phone").value.trim();
let sportValue = document.getElementById("sport").value;
let messageValue = document.getElementById("message").value;

let nameRegex = /^[A-Za-z ]+$/;
let phoneRegex = /^[0-9]{10}$/;

// Validation
if(!nameRegex.test(nameValue)){
alert("Name should contain only alphabets");
return;
}

if(!phoneRegex.test(phoneValue)){
alert("Phone should contain exactly 10 digits");
return;
}
let user = {
name: nameValue,
phone: phoneValue,
sport: sportValue,
message: messageValue
};
let users = JSON.parse(localStorage.getItem("users")) || [];
users.push(user);
localStorage.setItem("users", JSON.stringify(users));

alert("Enrollment Successful!");
displayUsers();
this.reset();
});
function displayUsers(){
let users = JSON.parse(localStorage.getItem("users")) || [];

let table = document.getElementById("userTable");

table.innerHTML = `
<tr>
<th>Name</th>
<th>Phone</th>
<th>Sport</th>
<th>Message</th>
<th>Action</th>
</tr>
`;

users.forEach((u, i) => {
let row = document.createElement("tr");
row.innerHTML = `
<td>${u.name}</td>
<td>${u.phone}</td>
<td>${u.sport}</td>
<td>${u.message}</td>
<td><button onclick="deleteUser(${i})">Delete</button></td>
`;
table.appendChild(row);
});
}
function deleteUser(i){
let users = JSON.parse(localStorage.getItem("users"));
users.splice(i,1);
localStorage.setItem("users", JSON.stringify(users));
displayUsers();
}

displayUsers();
const products = [
{ id:1, name:"Cricket Bat", price:1500 },
{ id:2, name:"Football Shoes", price:2000 },
{ id:3, name:"Basketball Jersey", price:1200 }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const shop = document.getElementById("shop");

products.forEach(p=>{
let div = document.createElement("div");
div.innerHTML = `
<p>${p.name} - ₹${p.price}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
`;
shop.appendChild(div);
});
function addToCart(id){
let item = cart.find(i=>i.id===id);

if(item){
item.qty++;
} else {
let p = products.find(x=>x.id===id);
cart.push({...p, qty:1});
}

updateCart();
}
function updateCart(){
localStorage.setItem("cart", JSON.stringify(cart));

let list = document.getElementById("cartList");
let total = 0;

list.innerHTML="";

cart.forEach((item,i)=>{
total += item.price * item.qty;

let li = document.createElement("li");
li.innerHTML = `
${item.name} x${item.qty} = ₹${item.price * item.qty}
<button onclick="changeQty(${i},1)">+</button>
<button onclick="changeQty(${i},-1)">-</button>
`;
list.appendChild(li);
});

document.getElementById("total").innerText = total;
}

function changeQty(i,change){
cart[i].qty += change;

if(cart[i].qty <= 0){
cart.splice(i,1);
}

updateCart();
}

updateCart();

</script>

</body>
</html>
