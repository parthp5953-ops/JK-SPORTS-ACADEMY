<!DOCTYPE html>
<html>
<head>
<title>JK Sports Academy</title>
<style>

html { scroll-behavior: smooth; }

body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(to bottom, #2e7d32, #1b5e20);
color: #fff;
}

h1 {
text-align: center;
padding: 25px;
margin: 0;
font-size: 36px;
letter-spacing: 2px;
background: black;
text-transform: uppercase;
}

nav { background: #ff6f00; }

nav ul {
list-style: none;
display: flex;
justify-content: center;
margin: 0;
padding: 0;
}

nav ul li {
padding: 15px 25px;
transition: 0.3s;
}

nav ul li:hover {
background: #e65100;
transform: scale(1.1);
}

nav ul li a {
text-decoration: none;
color: white;
font-weight: bold;
}

.container {
width: 90%;
max-width: 1100px;
margin: auto;
}

.sports-images {
display: flex;
justify-content: center;
gap: 20px;
margin: 30px 0;
flex-wrap: wrap;
}

.sports-images img {
width: 250px;
height: 170px;
border-radius: 10px;
border: 4px solid white;
transition: 0.4s;
}

.sports-images img:hover {
transform: scale(1.1);
box-shadow: 0 0 20px yellow;
}

section {
background: rgba(255,255,255,0.1);
padding: 20px;
margin: 20px 0;
border-radius: 10px;
}

h2 {
border-left: 5px solid yellow;
padding-left: 10px;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
background: white;
color: black;
}

th {
background: #ff6f00;
color: white;
}

th, td {
padding: 12px;
text-align: center;
border: 1px solid #ccc;
}

tr:hover { background-color: #ffe0b2; }

.enroll-form {
background: rgba(255,255,255,0.15);
padding: 20px;
border-radius: 10px;
display: flex;
flex-direction: column;
gap: 10px;
}

.enroll-form input,
.enroll-form select,
.enroll-form textarea {
padding: 10px;
border-radius: 5px;
border: none;
}

.enroll-form input[type="submit"] {
background: #ff6f00;
color: white;
font-weight: bold;
cursor: pointer;
}

.enroll-form input[type="submit"]:hover {
background: yellow;
color: black;
}

</style>
</head>

<body>

<h1>JK Sports Academy</h1>

<nav>

KJSSE/IT/SYBTECH /SEM-IV/WP-I/2025-26

Somaiya Vidyavihar University

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Sports</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<div class="container">

<div class="sports-images">
<img src="https://images.unsplash.com/photo-1517649763962-0c623066013b">
<img src="https://images.unsplash.com/photo-1546519638-68e109498ffc">
<img src="https://images.unsplash.com/photo-1519861531473-9200262188bf">
</div>

<section>
<h2>About Academy</h2>
<p>Professional coaching and training for young athletes.</p>
</section>

<section>
<h2>Sports Kits</h2>
<table id="sportsTable">
<tr>
<th>Sport</th>
<th>Kit Item</th>
<th>Purpose</th>
</tr>
</table>
</section>

<section>
<h2>Enrollment</h2>
<form class="enroll-form" id="form">
<input type="text" id="name" placeholder="Full Name" required>
<input type="tel" id="phone" placeholder="Contact Number" required>
<select id="sport" required>
<option value="">Select Sport</option>
<option>Football</option>
<option>Cricket</option>
<option>Basketball</option>
</select>
<textarea id="message" rows="4" placeholder="Your Message"></textarea>
<input type="submit" value="Enroll Now">
</form>
</section>


<section>
<h2>Enrolled Students</h2>
<table id="userTable">
<tr>
<th>Name</th>
<th>Phone</th>
<th>Sport</th>
<th>Message</th>
<th>Action</th>
</tr>
</table>
</section>

</div>

<script>

const sportsData = [



{"sport":"Cricket","kit":"Bat","purpose":"Hitting the ball"},
{"sport":"Football","kit":"Stud Shoes","purpose":"Better grip"},
{"sport":"Basketball","kit":"Jersey","purpose":"Identification"}
];


const sportsTable = document.getElementById("sportsTable");

sportsData.forEach(item => {
const row = document.createElement("tr");
row.innerHTML = `
<td>${item.sport}</td>
<td>${item.kit}</td>
<td>${item.purpose}</td>
`;
sportsTable.appendChild(row);
});


const form = document.getElementById("form");

form.addEventListener("submit", function(e){
e.preventDefault();

const user = {
name: document.getElementById("name").value,
phone: document.getElementById("phone").value,
sport: document.getElementById("sport").value,
message: document.getElementById("message").value
};

let users = JSON.parse(localStorage.getItem("users")) || [];
users.push(user);

KJSSE/IT/SYBTECH /SEM-IV/WP-I/2025-26

Somaiya Vidyavihar University
localStorage.setItem("users", JSON.stringify(users));

displayUsers();
form.reset();
});


function displayUsers(){
const table = document.getElementById("userTable");

table.innerHTML = `
<tr>
<th>Name</th>
<th>Phone</th>
<th>Sport</th>
<th>Message</th>
<th>Action</th>
</tr>
`;

let users = JSON.parse(localStorage.getItem("users")) || [];

users.forEach((user, index) => {
const row = document.createElement("tr");

row.innerHTML = `
<td>${user.name}</td>
<td>${user.phone}</td>
<td>${user.sport}</td>
<td>${user.message}</td>
<td><button onclick="deleteUser(${index})">Delete</button></td>
`;table.appendChild(row);
});
}


function deleteUser(index){
let users = JSON.parse(localStorage.getItem("users")) || [];
users.splice(index, 1);
localStorage.setItem("users", JSON.stringify(users));
displayUsers();
}


displayUsers();

</script>

</body>
</html>
